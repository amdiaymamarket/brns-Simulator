<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BRNS Simulator - générateur de blagues aléatoires avec une API externe."
    />
    <title>BRNS Joke Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="joke-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">😄</div>
        <p class="eyebrow">BRNS Simulator</p>
        <h1 id="page-title">Générateur de blagues</h1>
        <p class="intro">
          Clique sur le bouton pour découvrir une blague aléatoire fournie par une API externe.
        </p>

        <div id="jokeOutput" class="joke-output" aria-live="polite" aria-atomic="true">
          <p class="placeholder">Ta prochaine blague apparaît ici…</p>
        </div>

        <div class="actions">
          <button id="newJokeBtn" class="primary-btn" type="button">Nouvelle blague</button>
          <button id="copyBtn" class="secondary-btn" type="button" disabled>Copier</button>
        </div>

        <p id="statusMessage" class="status" role="status"></p>
        <p class="source">Source : <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
